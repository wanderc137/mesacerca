    <rect x="40" y="790" width="320" height="34" rx="12" fill="#1E2329"/>
    <rect x="40" y="812" width="320" height="12" fill="#1E2329"/>
    <text x="56" y="812" class="h4" font-size="15">AuditLog</text>
