<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120" role="img" aria-labelledby="title desc">
  <title id="title">MesaCerca · Modelo de datos</title>
  <desc id="desc">Diagrama entidad-relación con usuarios, direcciones, comercios, locales, menú, pedidos, pagos, repartidores, ofertas, reseñas, eventos y auditoría.</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E11"/>
      <stop offset="1" stop-color="#10151B"/>
    </linearGradient>
    <pattern id="grid4" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E2329" stroke-width="0.8"/>
    </pattern>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#848E9C"/>
    </marker>
    <marker id="a4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#F0B90B"/>
    </marker>
    <style>
      .t4 { font-family: Manrope, Inter, 'Segoe UI', Arial, sans-serif; font-weight: 800; fill: #EAECEF; }
      .s4 { font-family: Inter, 'Segoe UI', Arial, sans-serif; fill: #848E9C; }
      .h4 { font-family: Inter, 'Segoe UI', Arial, sans-serif; font-weight: 700; fill: #EAECEF; }
      .f4 { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: #AAB4C0; }
      .b4 { font-family: Inter, 'Segoe UI', Arial, sans-serif; fill: #AAB4C0; }
      .e4 { fill: #151A21; stroke: #2B3139; stroke-width: 1.3; }
      .k4 { font-family: Inter, 'Segoe UI', Arial, sans-serif; font-weight: 700; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg4)"/>
  <rect width="1600" height="1120" fill="url(#grid4)" opacity="0.4"/>

  <text x="48" y="58" class="t4" font-size="34">Modelo de datos</text>
  <text x="48" y="88" class="s4" font-size="16">Entidades principales del MVP · PostgreSQL + Prisma · los nombres de campos son los del dominio, no un esquema literal completo</text>
  <rect x="48" y="104" width="92" height="4" rx="2" fill="#F0B90B"/>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11">
    <rect x="1180" y="42" width="370" height="62" rx="10" fill="#10151B" stroke="#2B3139"/>
    <text x="1198" y="64" class="b4" font-size="11.5"><tspan fill="#F0B90B">1:N</tspan> relación · <tspan fill="#F0B90B">1:1</tspan> única · <tspan fill="#F0B90B">FK</tspan> clave foránea</text>
    <text x="1198" y="86" class="b4" font-size="11.5">Estados y enums se describen en docs/developer.md</text>
  </g>

  <!-- connectors (behind boxes) -->
  <g fill="none" stroke="#848E9C" stroke-width="1.5">
    <!-- User - Address -->
    <path d="M200 380 V416" marker-end="url(#a4)"/>
    <!-- User - Merchant -->
    <path d="M360 230 H396" marker-end="url(#a4)"/>
    <!-- User - Courier top route -->
    <path d="M250 140 V112 H1300 V136" marker-end="url(#a4)" stroke-dasharray="5 4"/>
    <!-- User - KycCase route -->
    <path d="M360 330 H382 V680 H364" marker-end="url(#a4)" stroke="#848E9C" stroke-dasharray="4 4"/>
    <!-- User - AuditLog route -->
    <path d="M360 360 H388 V862 H364" marker-end="url(#a4)" stroke-dasharray="4 4"/>
    <!-- Merchant - Store -->
    <path d="M560 330 V366" marker-end="url(#a4)"/>
    <!-- Store - Category -->
    <path d="M560 580 V616" marker-end="url(#a4)"/>
    <!-- Category - MenuItem -->
    <path d="M560 740 V776" marker-end="url(#a4)"/>
    <!-- Store - Order -->
    <path d="M720 390 H756" marker-end="url(#a4)" stroke="#F0B90B" stroke-opacity="0.8"/>
    <!-- Order - OrderItem -->
    <path d="M930 400 V436" marker-end="url(#a4)"/>
    <!-- Order - Payment route right -->
    <path d="M1100 360 H1120 V700 H1104" marker-end="url(#a4)"/>
    <!-- Order - DeliveryOffer route -->
    <path d="M1100 300 H1132 V450 H1136" marker-end="url(#a4)" stroke="#FF7A1A" stroke-opacity="0.8"/>
    <!-- Order - OrderEvent route -->
    <path d="M1100 200 H1124 V650 H1136" marker-end="url(#a4)"/>
    <!-- Courier - DeliveryOffer -->
    <path d="M1330 340 V376" marker-end="url(#a4)"/>
    <!-- OrderItem - MenuItem snapshot (dashed) -->
    <path d="M760 520 H724 V850 H720" marker-end="url(#a4)" stroke-dasharray="4 4" stroke-opacity="0.5"/>
  </g>

