    <rect x="40" y="632" width="320" height="12" fill="#1E2329"/>
    <text x="56" y="632" class="h4" font-size="15">KycCase</text>
    <g class="f4" font-size="11.2">
      <text x="56" y="666">id · userId · FK User</text>
      <text x="56" y="686">role · MERCHANT | COURIER</text>
      <text x="56" y="706">provider · didit</text>
      <text x="56" y="726">status · reason · reviewedAt</text>
