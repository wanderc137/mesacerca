    <text x="286" y="106">1:1 courier.userId</text>
    <text x="390" y="500">1:N</text>
    <text x="390" y="820">actor</text>
    <text x="568" y="350">1:N</text>
    <text x="568" y="602">1:N</text>
    <text x="568" y="762">1:N</text>
    <text x="736" y="382">1:N</text>
    <text x="938" y="422">1:N</text>
    <text x="1126" y="540">1:1</text>
    <text x="1140" y="420">1:N</text>
    <text x="1140" y="620">1:N</text>
    <text x="1338" y="364">1:N</text>
  </g>

